name: Daily News Digest

on:
  schedule:
    # 7:00 AM IST = 1:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to commit JSON files back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Fetch news and generate digest
        run: node scripts/fetch-news.mjs

      - name: Check if news file was created
        id: check_file
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "public/news/${TODAY}.json" ]; then
            echo "file_exists=true" >> $GITHUB_OUTPUT
            echo "date=${TODAY}" >> $GITHUB_OUTPUT
          else
            echo "file_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push news JSON
        if: steps.check_file.outputs.file_exists == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/news/
          git diff --staged --quiet || git commit -m "📰 Daily digest: ${{ steps.check_file.outputs.date }}"
          git push

      - name: Trigger Vercel redeploy
        if: steps.check_file.outputs.file_exists == 'true'
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
